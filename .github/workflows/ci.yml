name: ci
on:
  # Pull requests run once per push; pushes run only where pull requests land.
  push:
    branches: [master]
  pull_request:
jobs:
  check:
    # The organization's own Linux runners (shared organization runners), not GitHub's: hosted minutes are a
    # quota. All four labels, so that the job stays off the pool's other machines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base of a pull request, to see what it changed
      - uses: astral-sh/setup-uv@v6
        with:
          # These runners persist: uv's cache stays on their disk, nothing goes to GitHub's cache.
          enable-cache: false
          cache-local-path: ~/.cache/uv
      - run: uv sync --python 3.12 --extra cpu
      - run: uv run pyright
      - id: scope
        name: does the change touch the framework?
        # If this fails, it shows as failed and every test runs: an unknown scope never skips tests.
        continue-on-error: true
        run: |
          framework=$(PYTHONPATH=engine uv run python .github/scripts/framework_changed.py "${{ github.event.pull_request.base.sha || github.event.before }}")
          case "$framework" in
            true|false) echo "framework=$framework" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected answer: '$framework'"; exit 1 ;;
          esac
      # 8 workers, not one per core: a runner shares its machine with other jobs.
      - name: pytest
        if: steps.scope.outputs.framework != 'false'
        run: uv run pytest -n 8
      - name: pytest without tests/framework (the framework did not change)
        if: steps.scope.outputs.framework == 'false'
        run: uv run pytest -n 8 --ignore=tests/framework
