[unit]
id = "core.state.holder"
kind = "state"
process = ["worker"]
entry = "core.state.holder.unit:Unit"

[provides]
services = ["state.holder@1"]

[state]
drain_on_reload = false

[reads]
config = ["plan.cuda_graph", "plan.graph_memory_bytes", "batch.max_rows"]

[config]
"holder.mem_fraction" = { type = "float", default = 0.85, binding = "startup", doc = "Share of the device for the weights and the state pools (SGLang's mem_fraction_static); the rest is for activations and the runtime." }
"holder.state_ratio" = { type = "float", default = 0.9, binding = "startup", doc = "GDN state memory to KV memory (SGLang's mamba_full_memory_ratio)." }
"holder.max_slots" = { type = "int", default = 0, binding = "startup", doc = "GDN slots, if set (SGLang's max_mamba_cache_size); 0: by state_ratio." }
"holder.cpu_bytes" = { type = "int", default = 1073741824, binding = "startup", doc = "Memory for the state pools on a CPU device." }
