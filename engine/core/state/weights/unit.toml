[unit]
id = "core.state.weights"
kind = "state"
process = ["worker"]
entry = "core.state.weights.unit:Unit"

[provides]
services = ["state.weights@1"]

[config]
"model.path" = { type = "str", default = "", binding = "startup", doc = "Directory with the HF config.json" }
"model.hf_config" = { type = "dict", default = {}, binding = "startup", doc = "The HF config itself, without model.path" }
"model.dtype" = { type = "str", default = "bf16", binding = "startup", doc = "Parameter and activation dtype: bf16, f16, f32" }
"weights.path" = { type = "str", default = "", binding = "startup", doc = "A safetensors file or a directory of them; empty: dummy weights" }
"weights.dummy_seed" = { type = "int", default = 1234, binding = "startup", doc = "Seed of the dummy weights (initialize_dummy_weights)" }

[reads]
config = ["holder.sleep"]

[capabilities]
actions = ["refit"]
