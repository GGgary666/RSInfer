[unit]
id = "models.qwen38"
kind = "logic"
process = ["worker"]
entry = "models.qwen38.unit:Unit"

[provides]
services = ["model@1"]

[requires]
services = ["state.weights@1", "state.holder@1", "state.kv.paged@1", "state.gdn.slots@1", "layers.linear@1", "layers.embedding@1",
            "layers.norm@1", "layers.rope@1", "layers.activation@1", "layers.attn@1", "layers.gdn@1"]

[config]
"model.path" = { type = "str", default = "", binding = "startup", doc = "Directory with the HF config.json" }
"model.hf_config" = { type = "dict", default = {}, binding = "startup", doc = "The HF config itself, without model.path" }
"model.dtype" = { type = "str", default = "bf16", binding = "startup", doc = "Parameter and activation dtype: bf16, f16, f32" }

[reads]
config = ["state.kv.page_size", "state.kv.dtype", "state.gdn.conv_dtype", "state.gdn.ssm_dtype",
          # speculation: the MTP layer as the draft model (doc/specs/mtp.md)
          "spec.algorithm", "spec.num_steps", "spec.eagle_topk", "spec.num_draft_tokens", "batch.max_rows"]
