[unit]
id = "models.qwen38"
kind = "logic"
process = ["worker"]
entry = "models.qwen38.unit:Unit"

[provides]
services = ["model@1"]

[requires]
services = ["state.weights@1", "state.holder@1", "state.kv.paged@1", "state.gdn.slots@1", "layers.linear@1", "layers.embedding@1",
            "layers.norm@1", "layers.rope@1", "layers.activation@1", "layers.attn@1", "layers.gdn@1"]

[reads]
config = ["model.path", "model.hf_config", "model.dtype", "state.kv.page_size", "state.kv.dtype",
          "state.gdn.conv_dtype", "state.gdn.ssm_dtype",
          # speculation: the MTP layer as the draft model (doc/specs/mtp.md)
          "spec.algorithm", "spec.num_draft_tokens", "batch.max_rows"]
