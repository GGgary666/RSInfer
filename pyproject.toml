[project]
name = "rsinfer"
version = "0.0.0"
description = "RSI-native inference engine"
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.19",
    "pyzmq>=26",
]

[project.optional-dependencies]
frontend = ["transformers>=5,<6", "jinja2>=3.1", "fastapi>=0.115", "uvicorn>=0.30"]
# Select one PyTorch runtime. CI uses `cpu`, and SM100 deployments use `gpu`.
cpu = ["torch==2.11.0", "safetensors==0.8.0"]
gpu = [
    "torch==2.11.0 ; sys_platform == 'linux'",
    "safetensors==0.8.0",
    # The real kernels (kernels.triton, kernels.flashinfer): Triton is the version torch pins;
    # FlashInfer is the version SGLang e838360 pins.
    "triton==3.6.0 ; sys_platform == 'linux'",
    "flashinfer_python[cu13]==0.7.2 ; sys_platform == 'linux'",
]
# PyTorch and TorchNPU for CANN 9.2.0. CANN and the GLM custom ops are provided
# by the Ascend runtime environment (deploy/ascend.md).
ascend = [
    "rsinfer[frontend] ; sys_platform == 'linux'",
    "torch==2.10.0 ; sys_platform == 'linux'",
    "torch-npu==2.10.0.post7 ; sys_platform == 'linux'",
    "safetensors==0.8.0 ; sys_platform == 'linux'",
    # TBE from the toolkit imports these from the worker's Python environment.
    "attrs ; sys_platform == 'linux'",
    "decorator>=4.4 ; sys_platform == 'linux'",
    "psutil ; sys_platform == 'linux'",
    "scipy ; sys_platform == 'linux'",
]
ascend-memcache = [
    "memcache-hybrid==1.3.0 ; sys_platform == 'linux'",
    "memfabric-hybrid==1.3.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "pyright>=1.1.390",
    "pytest-xdist>=3.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # The HF reference the model units are tested against (stage2-contract.md §1.3).
    "transformers==5.22.1",
]

[tool.uv]
# The engine source tree is never installed: processes import it from a
# snapshot directory (doc/specs/nodeagent.md), and an editable install would
# put the agent's workspace on sys.path.
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }, { extra = "ascend" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
    { index = "pytorch-cpu", extra = "ascend" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine", "."]
addopts = "-ra --ignore=tests/framework/formal --ignore=tests/gpu"
timeout = 120
markers = [
    "covers(edges=(), ladder=(), kinds=()): what a test exercises, for the coverage check (tests/scenarios/coverage.py)",
]

[tool.pyright]
include = ["engine", "tests", "deploy"]
extraPaths = ["engine", "."]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownLambdaType = false
