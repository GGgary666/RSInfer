[unit]
id = "schedfix.worker"
kind = "logic"
process = ["worker"]
entry = "schedfix.worker.unit:Unit"

[provides]
services = ["proc.loop@1"]

[requires]
services = ["proc.streams@1", "proc.control@1"]

[config]
"schedfix.scheduler" = { type = "dict", default = {}, binding = "startup", doc = "ProcId of the scheduler host." }
"schedfix.capacity" = { type = "dict", default = {}, binding = "startup", doc = "Usable items per state kind." }
"schedfix.pages" = { type = "dict", default = {}, binding = "startup", doc = "Tokens per item per state kind; 0 for a slot kind." }
"schedfix.max_batch" = { type = "int", default = 32, binding = "startup" }
"schedfix.delay_s" = { type = "float", default = 0.0, binding = "startup", doc = "How long each step takes." }
